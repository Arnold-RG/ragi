# RAGI production-class stack for a 32GB+ host.
# Does NOT waste RAM on idle allocations — sizing is capacity, not forced usage.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragi_change_me}
      POSTGRES_DB: ragi
    ports:
      - "5432:5432"
    volumes:
      - ragi_pg:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragi -d ragi"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - ragi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://ragi:${POSTGRES_PASSWORD:-ragi_change_me}@postgres:5432/ragi?schema=public
      REDIS_URL: redis://redis:6379
      RAGI_HEAP_MB: "28672"
      NODE_OPTIONS: --max-old-space-size=28672
    ports:
      - "8787:8787"
    # Soft ceiling on a 32GB machine (API + headroom for OS/DB/Redis)
    deploy:
      resources:
        limits:
          memory: 28G
        reservations:
          memory: 4G

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:8787}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ragi_pg:
  ragi_redis:
