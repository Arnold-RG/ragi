# RAGI production-class stack for a 32GB+ host.
# Does NOT waste RAM on idle allocations — sizing is capacity, not forced usage.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "4gb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - ragi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      # SQLite file on the ragi_vault volume mounted at /var/ragi/data
      DATABASE_URL: file:/var/ragi/data/ragi.db
      REDIS_URL: redis://redis:6379
      RAGI_DATA_DIR: /var/ragi/data
      RAGI_HEAP_MB: "28672"
      NODE_OPTIONS: --max-old-space-size=28672
    ports:
      - "8787:8787"
    volumes:
      # Append-only JSON + DB file snapshots survive image rebuilds
      - ragi_vault:/var/ragi/data
    # Soft ceiling on a 32GB machine (API + headroom for OS/DB/Redis)
    deploy:
      resources:
        limits:
          memory: 28G
        reservations:
          memory: 4G

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:8787}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  ragi_redis:
  ragi_vault:
