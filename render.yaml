# RAGI on Render — created by Arnold Rurangwa / Arnova Group.
# Web services are Free. The Postgres instance is a workspace-shared Free
# database (one per workspace) with a dedicated logical database and role
# for this app. DATABASE_URL is set in the Dashboard / MCP, not in this file.
# Region: Frankfurt. Do not commit secrets.

services:
  - type: web
    name: arnova-ragi-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_DOCS_ENABLED
        value: "false"
      - key: REGISTRATION_MODE
        value: invite
      - key: COOKIE_SECURE
        value: "true"
      - key: AGENTS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: RAGI_OWNER_SETUP_TOKEN
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: arnova-ragi
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAGI_API_ORIGIN
        sync: false
