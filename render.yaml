# RAGI on Render — created by Arnold Rurangwa / Arnova Group.
# Two Free web services in Frankfurt. The database is a separate Neon
# Postgres project (not Render Postgres). Set DATABASE_URL in the
# Dashboard / MCP from the Neon connection string; do not commit it.
# Region: Frankfurt. Do not commit secrets.

services:
  - type: web
    name: arnova-ragi-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_DOCS_ENABLED
        value: "false"
      - key: REGISTRATION_MODE
        value: closed
      - key: COOKIE_SECURE
        value: "true"
      - key: AGENTS_ENABLED
        value: "false"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: RAGI_OWNER_SETUP_TOKEN
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://arnova-ragi.onrender.com
      - key: CORS_ORIGINS
        value: '["https://arnova-ragi.onrender.com"]'
      - key: OMH_API_URL
        value: https://arnova-omh-api.onrender.com
      - key: ECOSYSTEM_SIGNING_KEY_ID
        sync: false
      - key: ECOSYSTEM_KEYRING_JSON
        sync: false
      - key: GITHUB_SYNC_TOKEN
        sync: false
      - key: GITHUB_SYNC_INTERVAL_HOURS
        value: "0"
      - key: GITHUB_SYNC_INCLUDE_PRIVATE
        value: "false"

  - type: web
    name: arnova-ragi
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAGI_API_ORIGIN
        value: https://arnova-ragi-api.onrender.com
      - key: NEXT_PUBLIC_OMH_URL
        value: https://arnova-omh.onrender.com
