[project]
name = "ragi-backend"
version = "2.0.0a1"
description = "RAGI v2 — operations engine of the Arnova Group ecosystem. Created by Arnold Rurangwa / Arnova Group."
authors = [{ name = "Arnold Rurangwa / Arnova Group" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "cryptography>=43",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "referencing>=0.37.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
